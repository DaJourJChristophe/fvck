version: 1

languages:
  Cpp:
    program_path: g++
    parameters:
      - -c
      - -ggdb3
      - -O0
      - -Wall
      - -Wextra
      - -Werror
    # Required: defines exactly how argv is constructed.
    # Variables: {program}, {input}, {output}, {depfile}
    # List vars: {parameters} (splice), etc.
    #
    # For correct dependency-based caching, emit depfiles:
    #   -MMD -MF {depfile}
    command:
      argv:
        - "{program}"
        - { var: "parameters", splice: true }
        - -MMD
        - -MF
        - "{depfile}"
        - -o
        - "{output}"
        - "{input}"
    outputs:
      .cc: .o
      .cpp: .o

targets:
  - name: example_lib
    sources:
      - examples/*.cpp

link_targets:
  - name: app
    program_path: g++
    parameters: []
    output: app.exe
    from_targets: [example_lib]
    command:
      argv:
        - "{program}"
        - { var: "parameters", splice: true }
        - { var: "objects", splice: true }
        - -o
        - "{output}"

